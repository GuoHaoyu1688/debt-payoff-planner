[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "debt-payoff-planner"
version = "0.1.0"
description = "Offline debt repayment strategies, amortization, fee IRR and actual payment tracking"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "The debt-payoff-planner Authors"}]
dependencies = ["PyYAML>=6,<7", "mcp>=1.16,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.11,<1", "httpx>=0.27,<1"]

[project.scripts]
debt = "debt_payoff_planner.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
[tool.pytest.ini_options]
testpaths = ["tests"]
